    modCompileOnly("curse.maven:mooncake-delight-1490740:7866540")
    modCompileOnly("maven.modrinth:mystiasizakaya:tDUctFCt")
    modCompileOnly 'extradelight:extradelight:1.0.3:all'
    modImplementation 'youkaishomecoming:youkaishomecoming-2.7.0'
    modImplementation 'entityculling:entityculling-forge-1.10.1-mc1.20.1'
    modImplementation 'AI-Improvements:AI-Improvements-1.20-0.5.2'
    modImplementation 'chloride:chloride-FORGE-mc1.20.1-v1.8.1'
    modImplementation 'embeddium:embeddium-0.3.31+mc1.20.1'
    modImplementation 'oculus:oculus-mc1.20.1-1.8.0'
    modCompileOnly 'letsdo-vinery:letsdo-vinery-forge-1.4.41'
    modCompileOnly 'letsdo-nethervinery:letsdo-nethervinery-forge-1.2.19'
    modImplementation 'Jade:Jade-1.20.1-Forge-11.13.3'
    modCompileOnly 'StardewValleyFood:StardewValleyFood_1.20.1_0.3.3_Forge'
    modCompileOnly 'polymorph:polymorph-forge-0.49.10+1.20.1'
    modImplementation 'ModernUI:ModernUI-Forge-1.20.1-3.12.0.1-universal'
    modImplementation 'manors_bounty:manors_bounty-0.3.3.1-forge-1.20.1'
    modCompileOnly 'manors_bounty_machine:manors_bounty_machine_forge_1.20.1-1.0.8'
    modCompileOnly 'ThirstWasTaken:ThirstWasTaken-1.20.1-1.4.0'
    modCompileOnly 'alexsmobs:alexsmobs-1.22.9'
    modCompileOnly 'Aquaculture:Aquaculture-1.20.1-2.5.7'
    modCompileOnly 'unusualfishmod:unusualfishmod-1.1.8'
    modCompileOnly 'starlight:starlight-1.1.2+forge.1cda73c'
    modCompileOnly 'create:create-1.20.1-6.0.8'
    modImplementation 'netmusic:netmusic-1.5.1-forge+mc1.20.1'
    modImplementation 'melody:melody_forge_1.0.3_MC_1.20.1-1.20.4'
    modImplementation 'konkrete:konkrete_forge_1.8.0_MC_1.20-1.20.1'
    modImplementation 'fancymenu:fancymenu_forge_3.9.12_MC_1.20.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'it.unimi.dsi:fastutil:8.5.12'
    testImplementation 'org.spongepowered:mixin:0.8.5'
    compileOnly("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixinsquared_version}")
    annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:${mixinsquared_version}")
    compileOnly("io.github.llamalad7:mixinextras-common:${mixinextras_version}")
    annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    runtimeOnly("com.github.bawnorton.mixinsquared:mixinsquared-forge:${mixinsquared_version}")
    jarJar("com.github.bawnorton.mixinsquared:mixinsquared-forge:${mixinsquared_version}")

	
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // modCompileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // modCompileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // modLocalRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // modImplementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // modImplementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // modImplementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

def devMixinManifest = layout.buildDirectory.file('classes/java/main/META-INF/MANIFEST.MF')

tasks.register('syncDevMixinConfig', Copy) {
    dependsOn tasks.named('compileJava'), tasks.named('processResources')
    doFirst {
        devMixinManifest.get().asFile.delete()
    }
    from("src/main/resources/${mod_id}.mixins.json")
    from(layout.buildDirectory.file("mixin/${mod_id}.refmap.json"))
    into layout.buildDirectory.dir('classes/java/main')
}

[
        'prepareClientRun',
        'prepareServerRun',
        'prepareDataRun',
        'prepareGameTestServerRun'
].each { taskName ->
    tasks.named(taskName) {
        dependsOn tasks.named('syncDevMixinConfig')
    }
}

    jar {
    def mixinConfigFile = "${project.mod_id}.mixins.json".toString()
    def refmapFile = "${project.mod_id}.refmap.json".toString()

    manifest.attributes([
            "MixinConfigs": mixinConfigFile
    ])
    filesMatching([mixinConfigFile, refmapFile]) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    from('third_party/Fast-Recipe-Search-LICENSE.txt') {
        into 'META-INF/licenses'
        rename { 'RecipeSearch-LICENSE.txt' }
    }
    from('third_party/RecipeSearch-NOTICE.txt') {
        into 'META-INF'
    }
}

