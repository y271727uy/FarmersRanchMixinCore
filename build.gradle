tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

def devMixinManifest = layout.buildDirectory.file('classes/java/main/META-INF/MANIFEST.MF')
def devMixinConfigFile = "${mod_id}.mixins.json"

tasks.register('syncDevMixinConfig', Copy) {
    dependsOn tasks.named('compileJava'), tasks.named('processResources')
    doFirst {

        def manifestFile = devMixinManifest.get().asFile
        manifestFile.parentFile.mkdirs()
        manifestFile.text = "Manifest-Version: 1.0\nMixinConfigs: ${devMixinConfigFile}\n"
    }
    from("src/main/resources/${devMixinConfigFile}")
    from(layout.buildDirectory.file("mixin/${mod_id}.refmap.json"))
    into layout.buildDirectory.dir('classes/java/main')
}

tasks.named('jar') {
    dependsOn tasks.named('syncDevMixinConfig')
}

tasks.named('compileTestJava') {
    dependsOn tasks.named('syncDevMixinConfig')
}


[
        'prepareClientRun',
        'prepareServerRun',
        'prepareDataRun',
        'prepareGameTestServerRun'
].each { taskName ->
    tasks.named(taskName) {
        dependsOn tasks.named('syncDevMixinConfig')
    }
}

    jar {
    def mixinConfigFile = "${project.mod_id}.mixins.json".toString()
    def refmapFile = "${project.mod_id}.refmap.json".toString()

    manifest.attributes([
            "MixinConfigs": "${mixinConfigFile}"
    ])
    filesMatching([mixinConfigFile, refmapFile]) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    from('third_party/Fast-Recipe-Search-LICENSE.txt') {
        into 'META-INF/licenses'
        rename { 'RecipeSearch-LICENSE.txt' }
    }
    from('third_party/RecipeSearch-NOTICE.txt') {
        into 'META-INF'
    }
}

