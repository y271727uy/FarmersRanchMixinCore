var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}


idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}



// 先创建小的locator jar
tasks.register('locatorJar', Jar) {
    archiveBaseName = 'frmc-loader'
    archiveVersion = ''
    archiveClassifier = ''
    
    // 只包含locator相关的类
    from(sourceSets.main.output) {
        include 'com/y271727uy/FRMC/capability/downland/**'
    }
    
    // 包含SERVICE文件
    from('src/main/resources') {
        include 'META-INF/services/**'
    }
}

// 修改主jar：嵌入locator jar
jar {
    dependsOn locatorJar
    
    // 排除SERVICE文件（已在locator jar里）
    exclude 'META-INF/services/net.minecraftforge.forgespi.locating.IModLocator'
    
    // 嵌入locator jar到jarjar
    into('META-INF/jarjar') {
        from(locatorJar.archiveFile)
        rename { 'frmc-loader.jar' }
    }
    
    // 不需要Embedded-Dependencies-Mod，因为这不是加载mod
}

tasks.named('locatorJar') {
    dependsOn tasks.named('syncDevMixinConfig')
}

// 让reobfJar也依赖locatorJar
tasks.named('reobfJar') {
    dependsOn locatorJar
}
