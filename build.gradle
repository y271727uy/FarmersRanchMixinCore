    modImplementation 'geckolib:geckolib-forge-1.20.1-4.8.4'
    modCompileOnly 'mclib:mclib-20'
    modCompileOnly("maven.modrinth:architectury-api:1MKTLiiG")
    modCompileOnly("maven.modrinth:kotlin-for-forge:Zsh14XeQ")
    modCompileOnly("maven.modrinth:lets-do-farm-charm:9fzY3YV6")
    modCompileOnly("maven.modrinth:vintage-delight:q8Ght7Bo")
    modCompileOnly("maven.modrinth:fruits-delight:qPyefm6m")
    //modImplementation("maven.modrinth:observable:QtSVNyjm")
    //modImplementation("maven.modrinth:spark:4FXHDE9F")
    modImplementation("maven.modrinth:citadel:lTAAe4sZ")
