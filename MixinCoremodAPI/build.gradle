plugins {
    id 'java-library'
}

group = rootProject.property('mod_group_id')
version = rootProject.property('mod_version')

base {
    archivesName = 'MixinCoremodAPI'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
}

dependencies {
    api project(':MixinAgentAPI')
    compileOnly 'cpw.mods:modlauncher:10.0.9'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes('Automatic-Module-Name': 'frmc.mixincoremodapi')
    }
}
