plugins {
    id 'java-library'
}

group = rootProject.property('mod_group_id')
version = rootProject.property('mod_version')

base {
    archivesName = 'MixinFabricExtras'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly 'org.ow2.asm:asm-tree:9.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.spongepowered:mixin:0.8.5'
    testImplementation 'org.ow2.asm:asm-tree:9.2'
    testImplementation 'org.ow2.asm:asm-analysis:9.2'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes('Automatic-Module-Name': 'frmc.mixinfabricextras')
    }
}
